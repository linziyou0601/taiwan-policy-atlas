# 用途：選區地圖的設定。geo 階段依這份設定從來源讀出村里界線，合併成縣市、鄉鎮市區與每場選舉的選區，轉成 data/geo/map.json 與 data/geo/districts/，並核對每場選舉名冊的涵蓋都找得到圖形。
# 換用其他地圖來源時改寫本檔與 sources.yaml，程式不改。

# 地圖來源的代碼，登錄在 sources.yaml
source: taiwan-atlas
# 封存檔內的 TopoJSON 成員，內容是村里界線，已投影成 450×600 的螢幕座標，金門、連江、烏坵以插圖方式移到台灣本島左上
member: package/villages-mercator-10t.json
# 座標保留的小數位數，1 位在 450×600 的畫面上已小於一個像素
digits: 1
# 基本單位：縣市、鄉鎮市區與選區都由它合併
units:
  # TopoJSON 的集合名稱
  object: villages
  # 單位欄位對應來源屬性
  fields:
    # 縣市代碼，與名冊選區的 county 相同
    county: COUNTYCODE
    # 縣市名稱
    county_name: COUNTYNAME
    # 鄉鎮市區代碼
    town_code: TOWNCODE
    # 鄉鎮市區名稱，與名冊選區的 towns 比對
    town: TOWNNAME
    # 村里名稱，與名冊選區的 areas 比對
    name: VILLNAME
# 轉出的幾何集合：鍵是產物中的圖層名稱
layers:
  # 縣市：選區頁的第一層地圖
  counties:
    # 依這個單位欄位分組合併
    merge: county
    # 產物欄位對應單位欄位，第一個欄位也是排序鍵
    fields:
      # 縣市代碼
      code: county
      # 縣市名稱
      name: county_name
  # 鄉鎮市區：選區清單篩選與地圖的底線
  towns:
    # 依這個單位欄位分組合併
    merge: town_code
    # 產物欄位對應單位欄位
    fields:
      # 鄉鎮市區代碼
      code: town_code
      # 所屬縣市代碼
      county: county
      # 鄉鎮市區名稱
      name: town
  # 插圖的外框：金門、連江、澎湖、烏坵移位後的框線
  insets:
    # TopoJSON 的集合名稱
    object: compBorders
    # 產物欄位對應來源屬性
    fields:
      # 插圖所屬縣市代碼
      code: CODE
      # 插圖名稱
      name: NAME
# 名稱比對時視為相同的字，名冊與地圖兩邊都替換
name_equivalents:
  # 名冊與地圖來源對「臺」「台」的用字不一致
  臺: 台
  # 中選會名冊以私用區字元寫村里名的罕用字，U+E008 是「磘」，U+E02D 是「廍」
  "\ue008": 磘
  "\ue02d": 廍
  # 名冊寫「永豐村」，地圖寫「永豊村」
  豐: 豊
  # 名冊寫「瓊埔村」，地圖寫「欍埔村」
  瓊: 欍
