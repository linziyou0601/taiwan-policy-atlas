# 用途：台灣地位詮釋的主題測驗設定。這是探索性題組：題目與三條軸由本站編寫，每題的說明節錄一手文件，讀者可以對照原文判斷。topics 階段讀 data/topics/taiwan-status/ 的手寫表發布成網站的題組。
# 沒有經過驗證的量表可以對照，也沒有參照類型，結果只列出三條軸的位置。

# 題組代碼，與檔名、手寫表目錄同名
id: taiwan-status
# 顯示名稱
label: 台灣地位詮釋（探索性）
# 選擇頁的一句說明
description: 14 題，對照戰後的一手文件，看你怎麼詮釋台灣的國際地位
# 題目的來源與授權，結果頁與資料集頁顯示。題目由本站編寫，沒有可連結的原始測驗
origin:
  # 來源名稱
  name: 本站編寫的探索性題目
  # 引用的版本
  version: 各題節錄的文件與網址寫在題目說明
  # 授權
  license: 題目與軸採 CC BY 4.0，節錄的文件依各來源的授權
# 題目與計分的說明，結果頁的方法說明顯示
note: 探索性題組：題目與三條軸由本站編寫，沒有經過驗證的量表，也還沒有經過獨立複評。三條軸各有同意與反對兩個方向的題目，避免一路同意就推向同一端。結果只表示你對這些詮釋的同意程度，不是法律上的結論
# 參照點距離的策略，登錄在網站的 registry distance 類。這套沒有參照點，距離不會用到
distance: powerSum
# 這套測驗用到的主題測驗卡片，登錄在 layout.json，結果頁與方法頁依此列出
cards: [topic.summary, topic.axes, topic.radar, methods.topic]
# 各軸的分數門檻，由高到低。大於 60 偏向正極，40 到 60 之間沒有明顯傾向
bands:
  - { min: 60, inclusive: false }
  - { min: 40, inclusive: true }
  - { min: 0, inclusive: true }
# 三條軸，順序即雷達圖與長條的順序。positive 是分數 100 的一極，labels 依 bands 的順序對應每一級的標籤，power 是距離的次方
axes:
  - # 軸代碼，與手寫表的軸欄相同
    code: sovereignty
    # 軸名稱
    name: 戰後主權歸屬
    # 分數 0 的一極
    negative: 地位未定
    # 分數 100 的一極
    positive: 已歸屬中華民國
    # 參照點距離的次方
    power: 2
    # 各級標籤，由高分到低分
    labels: [傾向已歸屬, 沒有明顯傾向, 傾向未定]
  - # 軸代碼
    code: relation
    # 軸名稱
    name: 與中國的關係
    # 分數 0 的一極
    negative: 互不隸屬
    # 分數 100 的一極
    positive: 同屬一個中國
    # 參照點距離的次方
    power: 2
    # 各級標籤，由高分到低分
    labels: [傾向同屬一中, 沒有明顯傾向, 傾向互不隸屬]
  - # 軸代碼
    code: basis
    # 軸名稱
    name: 判斷地位的依據
    # 分數 0 的一極
    negative: 條約與國際文件
    # 分數 100 的一極
    positive: 人民意志與實際統治
    # 參照點距離的次方
    power: 2
    # 各級標籤，由高分到低分
    labels: [傾向人民意志, 沒有明顯傾向, 傾向條約文件]
