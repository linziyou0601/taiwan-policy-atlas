# 用途：2026 直轄市長、縣市長的管線設定。抓取階段依 sources 取得原始檔，抽取階段依 roster 讀取名冊、依 documents 抽取政見原文。
# 新增一場選舉時複製本檔到 data/10-fetch/{選舉代碼}/election.yaml 改寫，步驟見 docs/pipeline/fetch.md。

# 選舉代碼，與檔名相同，各層產物目錄以它命名
id: 2026-mayor
# 顯示名稱
label: 2026 直轄市長、縣市長
# 選舉年度
year: 2026
# 職位名稱
office: 直轄市長、縣市長
# 比較對象的類型：ticket 為正副組合、candidate 為候選人、party 為政黨
entity_type: candidate
# 選區的類型：national、county、district、town、town-district、village，決定選區代碼取哪幾段行政代碼
scope_type: county
# 名冊：中選會選舉資料庫在投票之後才收錄這場選舉，選前依公報手寫在抽取階段的 scopes.tsv 與 roster.tsv
roster:
  # 寫 true 時讀抽取階段手寫的選區表與名冊表，不經名冊來源
  tables: true
# 政見原文文件，抽取階段逐份抽取文字與影像；空清單表示這場選舉尚未收錄政見原文
