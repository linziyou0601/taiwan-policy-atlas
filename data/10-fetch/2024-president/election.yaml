# 用途：2024 總統、副總統的管線設定。抓取階段依 sources 取得原始檔，抽取階段依 roster 匯入名冊、依 documents 抽取政見原文。
# 新增一場選舉時複製本檔到 data/10-fetch/{選舉代碼}/election.yaml 改寫，步驟見 docs/pipeline/fetch.md。

# 選舉代碼，與檔名相同，各層產物目錄以它命名
id: 2024-president
# 顯示名稱
label: 2024 總統、副總統
# 選舉年度
year: 2024
# 職位名稱
office: 總統、副總統
# 比較對象的類型：ticket 為正副組合、candidate 為候選人、party 為政黨
entity_type: ticket
# 選區的類型：national、county、district、town、town-district、village，決定選區代碼取哪幾段行政代碼
scope_type: national
# 名冊匯入
roster:
  # 名冊所在的來源代碼
  source: cec-votedata
  # 封存檔內含 elbase、elcand、elpaty 的目錄，可以多個
  paths:
    - votedata/votedata/voteData/2024總統立委/總統/
  # 另檔補充的名冊，例如延選，format 為補充檔的格式名稱，登錄在 cec-roster adapter
  supplements: []
# 政見原文文件，抽取階段逐份抽取文字與影像；空清單表示這場選舉尚未收錄政見原文
documents:
  - # 文件代碼，抽取產物以它命名
    id: bulletin
    # 來源代碼
    source: cec-bulletin-2024
    # 封存檔內的成員路徑
    member: 113/01第16任總統副總統選舉/第16任總統副總統選舉選舉公報.pdf
    # 文件標題
    title: 第 16 任總統副總統選舉選舉公報
    # 政見欄影像，代碼是「p頁碼-嵌入順序」，抽取階段只寫出這些影像。政見在文字層的文件寫空清單
    images: [p1-5, p1-6, p1-7]
