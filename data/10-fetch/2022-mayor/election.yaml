# 用途：2022 直轄市長、縣市長的管線設定。抓取階段依 sources 取得原始檔，抽取階段依 roster 匯入名冊、依 documents 抽取政見原文。
# 新增一場選舉時複製本檔到 data/10-fetch/{選舉代碼}/election.yaml 改寫，步驟見 docs/pipeline/fetch.md。

# 選舉代碼，與檔名相同，各層產物目錄以它命名
id: 2022-mayor
# 顯示名稱
label: 2022 直轄市長、縣市長
# 選舉年度
year: 2022
# 職位名稱
office: 直轄市長、縣市長
# 比較對象的類型：ticket 為正副組合、candidate 為候選人、party 為政黨
entity_type: candidate
# 選區的類型：national、county、district、town、town-district、village，決定選區代碼取哪幾段行政代碼
scope_type: county
# 名冊匯入
roster:
  # 名冊所在的來源代碼
  source: cec-votedata
  # 封存檔內含 elbase、elcand、elpaty 的目錄，可以多個
  paths:
    - votedata/votedata/voteData/2022-111年地方公職人員選舉/C1/city/
    - votedata/votedata/voteData/2022-111年地方公職人員選舉/C1/prv/
  # 另檔補充的名冊，例如延選，format 為補充檔的格式名稱，登錄在 cec-roster adapter
  supplements:
    - # 封存檔內的成員路徑
      member: votedata/votedata/2022年_嘉義市長重行選舉/cand.csv
      # 縣市代碼
      county: "10020"
      # 選區代碼
      scope_key: 10-020
      # 選區名稱
      name: 嘉義市
      # 補充檔格式
      format: named-candidate-csv
      # 現任者的號次：補充檔沒有現任欄，依中選會 2018 年嘉義市長當選資料登錄
      incumbent_numbers: [1]
# 政見原文文件，抽取階段逐份抽取文字與影像；空清單表示這場選舉尚未收錄政見原文
