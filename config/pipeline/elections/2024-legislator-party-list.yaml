# 用途：2024 不分區立法委員的管線設定。抓取層依 sources 取得原始檔，抽取層依 roster 匯入名冊、依 documents 抽取政見原文。
# 新增一屆選舉時複製本檔改寫，程式不改。

# 選舉代碼，與檔名相同，各層產物目錄以它命名
id: 2024-legislator-party-list
# 顯示名稱
label: 2024 不分區立法委員
# 選舉年度
year: 2024
# 職位名稱
office: 全國不分區及僑居國外國民立法委員
# 比較對象的類型：ticket 為正副組合、candidate 為候選人、party 為政黨
entity_type: party
# 選區的類型：national、county、district、town、town-district、village，決定選區代碼取哪幾段行政代碼
scope_type: national
# 名冊匯入
roster:
  # 名冊所在的來源代碼
  source: cec-votedata
  # 封存檔內含 elbase、elcand、elpaty 的目錄，可以多個
  paths:
    - votedata/votedata/voteData/2024總統立委/不分區政黨/
  # 另檔補充的名冊，例如延選，format 為補充檔的格式名稱，登錄在 cec-roster adapter
  supplements: []
# 政見原文文件，抽取層逐份抽取文字與影像；空清單表示這場選舉尚未收錄政見原文
documents:
  - # 文件代碼，抽取產物以它命名
    id: bulletin
    # 來源代碼
    source: cec-bulletin-2024
    # 封存檔內的成員路徑
    member: 113/05第11屆全國不分區及僑居國外國民立法委員選舉/全國不分區及僑居國外國民立委選舉公報.pdf
    # 文件標題
    title: 第 11 屆全國不分區及僑居國外國民立法委員選舉選舉公報
    # 政見欄影像，代碼是「p頁碼-嵌入順序」，抽取層只寫出這些影像。政見在文字層的文件寫空清單
    images: [p1-0, p1-4, p1-6, p1-8, p1-10, p2-0, p2-3, p2-5, p3-1, p3-3, p4-1, p4-3, p4-6]
